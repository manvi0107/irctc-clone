<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - IRCTC Clone</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>IRCTC Login</h1>
  </header>

  <main>
    <form id="loginForm">
      <label>
        Username:
        <input type="text" id="username" required />
      </label>
      <label>
        Password:
        <input type="password" id="password" required />
      </label>
      <button type="submit">Login</button>
    </form>
  </main>

  <script src="auth.js"></script>
</body>
</html>
