<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Booking Confirmation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <script>
    if (localStorage.getItem('loggedIn') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>

  <header>
    <h1>Booking Confirmation</h1>
  </header>

  <main style="padding: 20px;">
    <h2>Thank you for booking!</h2>
    <p>Your ticket has been confirmed.</p>
    <p><strong>Train:</strong> Rajdhani Express</p>
    <p><strong>Time:</strong> 10:00 AM</p>
    <p><strong>From:</strong> <span id="fromText"></span></p>
    <p><strong>To:</strong> <span id="toText"></span></p>
    <button onclick="window.location.href='index.html'">Book Another Ticket</button>
  </main>

  <script>
    document.getElementById('fromText').innerText = localStorage.getItem('from') || '-';
    document.getElementById('toText').innerText = localStorage.getItem('to') || '-';
  </script>
</body>
</html>
